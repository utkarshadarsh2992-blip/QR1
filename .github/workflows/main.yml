name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Install Capacitor
        run: npm install --no-save @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8

      - name: Prepare Capacitor web directory
        run: |
          rm -rf dist
          mkdir -p dist

          cat > dist/index.html <<'EOF'
          <!doctype html>
          <html>
            <head>
              <meta charset="UTF-8">
              <meta
                name="viewport"
                content="width=device-width, initial-scale=1.0"
              >
              <title>QR1</title>
            </head>
            <body>
              <div id="root"></div>
            </body>
          </html>
          EOF

      - name: Initialize Capacitor
        run: npx cap init QR1 com.qr1.app --web-dir dist

      - name: Configure Capacitor
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.qr1.app",
            "appName": "QR1",
            "webDir": "dist",
            "server": {
              "url": "https://qr-1-5sh1.vercel.app",
              "androidScheme": "https"
            }
          }
          EOF

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QR1-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
