name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Install Capacitor
        run: |
          npm install --no-save \
            @capacitor/core@8 \
            @capacitor/cli@8 \
            @capacitor/android@8

      - name: Build app for Capacitor
        run: |
          rm -rf dist
          CAPACITOR_BUILD=true npx vite build

      - name: Inspect static build
        run: |
          echo "=== dist ==="
          find dist -maxdepth 4 -type f | sort

          echo ""
          echo "=== client ==="
          find dist/client -maxdepth 4 -type f | sort || true

      - name: Verify Capacitor web assets
        run: |
          test -f dist/client/index.html

          echo "Capacitor web assets found:"
          ls -lah dist/client

      - name: Initialize Capacitor
        run: |
          npx cap init QR1 com.qr1.app --web-dir dist/client

      - name: Configure Capacitor
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.qr1.app",
            "appName": "QR1",
            "webDir": "dist/client",
            "android": {
              "backgroundColor": "#000000"
            }
          }
          EOF

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QR1-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
